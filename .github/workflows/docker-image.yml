name: ci

on:
  push:
    branches:
      - "master"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      -
        name: Install dependencies
        run: pip install -r requirements-dev.txt
      -
        name: Test
        run: pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: date-restore:test
          cache-to: type=gha,mode=max
      -
        name: Smoke test
        run: |
          set -eu
          media="$RUNNER_TEMP/media"
          movie="$media/movies/Movie (2020)"
          mkdir -p "$movie" "$media/tv"
          touch -d 2020-01-01 "$movie/Movie (2020) - 1080p.mkv"

          docker run -d --name smoke --read-only --network=none \
            --user "$(id -u):$(id -g)" -v "$media:/media" date-restore:test
          trap 'docker logs smoke; docker rm -f smoke > /dev/null' EXIT

          for i in $(seq 30); do
            docker logs smoke 2>&1 | grep -q "Watching for file changes" && break
            sleep 1
          done
          docker logs smoke 2>&1 | grep -q "Watching for file changes"
          grep -q '"movies/Movie (2020)"' "$media/media-timestamps.json"

          echo upgrade > "$movie/Movie (2020) - 2160p.mkv"
          expected=$(date -d 2020-01-01 +%s)
          for i in $(seq 10); do
            [ "$(stat -c %Y "$movie/Movie (2020) - 2160p.mkv")" = "$expected" ] && break
            sleep 1
          done
          [ "$(stat -c %Y "$movie/Movie (2020) - 2160p.mkv")" = "$expected" ]

          start=$(date +%s)
          docker stop smoke
          [ $(( $(date +%s) - start )) -lt 5 ]
          [ "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = 0 ]
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ github.repository }}
            ghcr.io/${{ github.repository }}
          flavor: latest=true
      -
        name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
